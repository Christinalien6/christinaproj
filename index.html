<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetic Fragments</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
    color: #5a5047;
    background: #f5f0e8;
  }

  #scene-container {
    position: relative;
    width: 100%;
    height: 100%;
    background-image: url('assets/background.png');
    background-size: cover;
    background-position: center;
    transition: background-color 0.8s ease;
  }

  /* Vignette overlay for Scene 2 */
  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(30, 25, 20, 0.55) 100%);
    transition: opacity 1s ease;
    z-index: 1;
  }
  #vignette.active { opacity: 1; }

  /* Fragment pieces */
  .fragment {
    position: absolute;
    width: 130px;
    height: 130px;
    cursor: pointer;
    transition: filter 0.5s ease, transform 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                left 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                top 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.5s ease;
    z-index: 10;
    user-select: none;
    -webkit-user-select: none;
  }
  .fragment img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  .fragment:hover:not(.activated):not(.merging) {
    filter: brightness(1.15);
    transform: scale(1.08);
  }
  .fragment.activated {
    filter: brightness(1.3) drop-shadow(0 0 12px rgba(220, 195, 150, 0.7));
    cursor: default;
  }
  .fragment.merging {
    cursor: default;
  }
  .fragment.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Bobbing animation */
  @keyframes bob1 {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes bob2 {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes bob3 {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  #fragment-1 { animation: bob1 3.2s ease-in-out infinite; }
  #fragment-2 { animation: bob2 2.8s ease-in-out infinite 0.4s; }
  #fragment-3 { animation: bob3 3.5s ease-in-out infinite 0.8s; }
  .fragment.activated { animation-play-state: paused; }
  .fragment.merging { animation: none !important; }

  /* Text elements */
  #instruction-text {
    position: absolute;
    bottom: 100px;
    width: 100%;
    text-align: center;
    font-size: 15px;
    letter-spacing: 2px;
    color: #8a7e72;
    opacity: 0.8;
    z-index: 5;
    transition: opacity 0.5s ease;
  }

  #progress-text {
    position: absolute;
    bottom: 70px;
    width: 100%;
    text-align: center;
    font-size: 13px;
    letter-spacing: 3px;
    color: #a89c90;
    z-index: 5;
    transition: opacity 0.5s ease;
  }

  /* Revealed lines */
  .revealed-line {
    position: absolute;
    width: 100%;
    text-align: center;
    font-size: 17px;
    font-style: italic;
    letter-spacing: 1px;
    color: #6b6056;
    opacity: 0;
    transition: opacity 0.8s ease;
    z-index: 5;
  }
  .revealed-line.visible { opacity: 1; }
  #line-1 { bottom: 180px; }
  #line-2 { bottom: 210px; }
  #line-3 { bottom: 240px; }

  /* Final composition */
  #final-image {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 260px;
    height: 260px;
    object-fit: contain;
    opacity: 0;
    z-index: 15;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  #final-image.visible { opacity: 1; }

  /* Final message overlay */
  #final-message {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, calc(-50% + 170px));
    font-size: 20px;
    font-style: italic;
    letter-spacing: 2px;
    color: #5a5047;
    opacity: 0;
    white-space: nowrap;
    z-index: 20;
    transition: opacity 1s ease;
    pointer-events: none;
  }
  #final-message.visible { opacity: 1; }

  /* Reset button */
  #reset-btn {
    position: absolute;
    left: 50%;
    bottom: 60px;
    transform: translateX(-50%);
    padding: 10px 32px;
    font-family: Georgia, serif;
    font-size: 14px;
    letter-spacing: 2px;
    color: #6b6056;
    background: rgba(245, 240, 232, 0.85);
    border: 1px solid #c4b8a8;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.6s ease, background 0.3s ease;
  }
  #reset-btn.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #reset-btn:hover {
    background: rgba(220, 210, 195, 0.9);
  }
</style>
</head>
<body>

<div id="scene-container">
  <div id="vignette"></div>

  <div class="fragment" id="fragment-1">
    <img src="assets/fragment-1.png" alt="Fragment 1">
  </div>
  <div class="fragment" id="fragment-2">
    <img src="assets/fragment-2.png" alt="Fragment 2">
  </div>
  <div class="fragment" id="fragment-3">
    <img src="assets/fragment-3.png" alt="Fragment 3">
  </div>

  <div id="instruction-text">Click a fragment</div>
  <div id="progress-text">0 / 3</div>

  <div class="revealed-line" id="line-1">I remember a corner of light.</div>
  <div class="revealed-line" id="line-2">A sound, a color, a pause.</div>
  <div class="revealed-line" id="line-3">Then it becomes whole.</div>

  <img id="final-image" src="assets/final-composition.png" alt="Complete memory">
  <div id="final-message">Meaning returns when pieces connect.</div>
  <button id="reset-btn">Reset</button>
</div>

<script>
(function () {
  const fragments = [
    document.getElementById('fragment-1'),
    document.getElementById('fragment-2'),
    document.getElementById('fragment-3')
  ];
  const lines = [
    document.getElementById('line-1'),
    document.getElementById('line-2'),
    document.getElementById('line-3')
  ];
  const instructionText = document.getElementById('instruction-text');
  const progressText = document.getElementById('progress-text');
  const finalImage = document.getElementById('final-image');
  const finalMessage = document.getElementById('final-message');
  const resetBtn = document.getElementById('reset-btn');
  const vignette = document.getElementById('vignette');

  // Scatter positions for fragments (percentages of viewport)
  const scatterPositions = [
    { left: '18%', top: '28%' },
    { left: '55%', top: '20%' },
    { left: '38%', top: '55%' }
  ];

  let activated = 0;
  let clickOrder = [];
  let scene = 1;

  function initScene1() {
    scene = 1;
    activated = 0;
    clickOrder = [];

    // Reset vignette
    vignette.classList.remove('active');

    // Reset fragments
    fragments.forEach(function (frag, i) {
      frag.classList.remove('activated', 'merging', 'hidden');
      frag.style.left = scatterPositions[i].left;
      frag.style.top = scatterPositions[i].top;
      frag.style.transform = '';
      frag.style.width = '130px';
      frag.style.height = '130px';
      frag.style.opacity = '1';
      frag.style.transition = '';
    });

    // Reset lines
    lines.forEach(function (line) {
      line.classList.remove('visible');
    });

    // Reset UI
    instructionText.style.opacity = '0.8';
    progressText.style.opacity = '1';
    progressText.textContent = '0 / 3';
    finalImage.classList.remove('visible');
    finalMessage.classList.remove('visible');
    resetBtn.classList.remove('visible');
  }

  function onFragmentClick(index) {
    if (scene === 2) return;
    var frag = fragments[index];
    if (frag.classList.contains('activated') || frag.classList.contains('merging')) return;

    frag.classList.add('activated');
    activated++;
    clickOrder.push(index);

    // Reveal corresponding line (in order: first click -> line 1, etc.)
    if (activated <= 3) {
      lines[activated - 1].classList.add('visible');
    }

    // Update progress
    progressText.textContent = activated + ' / 3';

    if (activated >= 3) {
      instructionText.style.opacity = '0';
      startMerge();
    }
  }

  function startMerge() {
    // Calculate center position
    var container = document.getElementById('scene-container');
    var cx = container.offsetWidth / 2 - 65;
    var cy = container.offsetHeight / 2 - 65;

    // Move all fragments to center
    fragments.forEach(function (frag) {
      frag.classList.add('merging');
      frag.style.transition = 'left 1s cubic-bezier(0.4,0,0.2,1), top 1s cubic-bezier(0.4,0,0.2,1), opacity 0.6s ease';
      frag.style.left = cx + 'px';
      frag.style.top = cy + 'px';
    });

    // After merge animation, show final composition
    setTimeout(function () {
      fragments.forEach(function (frag) {
        frag.classList.add('hidden');
      });

      // Hide progress and lines
      progressText.style.opacity = '0';
      lines.forEach(function (line) {
        line.classList.remove('visible');
      });

      // Show final image
      finalImage.classList.add('visible');

      setTimeout(function () {
        // Transition to Scene 2
        scene = 2;
        vignette.classList.add('active');
        finalMessage.classList.add('visible');
        resetBtn.classList.add('visible');
      }, 600);
    }, 1100);
  }

  // Attach click handlers
  fragments.forEach(function (frag, i) {
    frag.addEventListener('click', function () {
      onFragmentClick(i);
    });
  });

  resetBtn.addEventListener('click', function () {
    // Fade out Scene 2 elements
    finalImage.classList.remove('visible');
    finalMessage.classList.remove('visible');
    resetBtn.classList.remove('visible');

    setTimeout(function () {
      initScene1();
    }, 500);
  });

  // Initialize
  initScene1();
})();
</script>

</body>
</html>
