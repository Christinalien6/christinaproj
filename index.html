<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      cursor: pointer;
      user-select: none;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #bg-bottom { z-index: 1; }
    #bg-top    { z-index: 2; opacity: 0; }

    #text-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
    }

    #text-layer p {
      margin-top: 25vh;
      color: white;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.85rem, 1.8vw, 1.25rem);
      text-shadow:
        0 0 14px rgba(0,0,0,1),
        0 2px 8px  rgba(0,0,0,0.9),
        0 0 40px   rgba(0,0,0,0.7);
      max-width: 680px;
      line-height: 1.65;
      letter-spacing: 0.03em;
    }

    #restart-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 20;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      padding: 0.45rem 1.1rem;
      font-family: Georgia, serif;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.2s, color 0.2s;
    }

    #restart-btn:hover {
      background: rgba(0, 0, 0, 0.72);
      color: white;
    }
  </style>
</head>
<body>

  <div id="bg-bottom" class="bg-layer"></div>
  <div id="bg-top"    class="bg-layer"></div>
  <div id="text-layer"><p id="msg"></p></div>
  <button id="restart-btn">↺ Restart</button>

  <script>
    const bottom     = document.getElementById('bg-bottom');
    const top        = document.getElementById('bg-top');
    const textLayer  = document.getElementById('text-layer');
    const msg        = document.getElementById('msg');
    const restartBtn = document.getElementById('restart-btn');

    const FADE_MS = 800;

    let locked       = true;
    let clickResolve = null;
    let gen          = 0;   // incremented on each run(); old runs check this to bail out

    const wait = ms => new Promise(r => setTimeout(r, ms));
    const src  = name => `assets/${name}`;

    // ── Crossfade ─────────────────────────────────────────────────────────────
    // Takes the current generation (g) so it skips the bottom-layer promotion
    // if a restart happened while the fade was in flight.
    function crossfade(imgName, g) {
      return new Promise(resolve => {
        top.style.transition      = 'none';
        top.style.opacity         = '0';
        top.style.backgroundImage = `url('${src(imgName)}')`;
        top.offsetHeight; // force reflow
        top.style.transition = `opacity ${FADE_MS}ms ease`;
        top.style.opacity    = '1';
        setTimeout(() => {
          if (g === gen) {
            bottom.style.backgroundImage = `url('${src(imgName)}')`;
            top.style.transition         = 'none';
            top.style.opacity            = '0';
          }
          resolve();
        }, FADE_MS + 60);
      });
    }

    // ── Text ──────────────────────────────────────────────────────────────────
    function showText(text) {
      return new Promise(resolve => {
        msg.textContent            = text;
        textLayer.style.transition = `opacity ${FADE_MS}ms ease`;
        textLayer.style.opacity    = '1';
        setTimeout(resolve, FADE_MS + 60);
      });
    }

    function hideText() {
      return new Promise(resolve => {
        textLayer.style.transition = `opacity ${FADE_MS}ms ease`;
        textLayer.style.opacity    = '0';
        setTimeout(resolve, FADE_MS + 60);
      });
    }

    // ── Click gate ────────────────────────────────────────────────────────────
    document.addEventListener('click', () => {
      if (locked || !clickResolve) return;
      locked = true;
      const resolve = clickResolve;
      clickResolve  = null;
      resolve();
    });

    function waitForClick() {
      return new Promise(resolve => {
        clickResolve = resolve;
        locked       = false;
      });
    }

    // ── Main sequence ─────────────────────────────────────────────────────────
    async function run() {
      const g  = ++gen;
      const ok = () => g === gen;  // false if a newer run has started

      // Lock clicks and kill any pending click resolver from the old run.
      locked       = true;
      clickResolve = null;

      // Snap layers back to a clean state immediately (no transition).
      textLayer.style.transition = 'none';
      textLayer.style.opacity    = '0';
      top.style.transition       = 'none';
      top.style.opacity          = '0';

      // Preload images.
      ['roomdark.png','roomlight1.png','clock2.png','clock3.png',
       'dooropen.png','lighton.png','room.png']
        .forEach(name => { new Image().src = src(name); });

      // 1. roomdark immediately → 3s → text → click
      bottom.style.backgroundImage = `url('${src('roomdark.png')}')`;
      await wait(3000);                                              if (!ok()) return;
      await showText("I don't remember what the room looked like. Can you help me recover the memory?");
                                                                     if (!ok()) return;
      await waitForClick();                                          if (!ok()) return;

      // 2. → roomlight1 → 3s → text → click
      await Promise.all([hideText(), crossfade('roomlight1.png', g)]); if (!ok()) return;
      await wait(3000);                                              if (!ok()) return;
      await showText("Click the clock.");                            if (!ok()) return;
      await waitForClick();                                          if (!ok()) return;

      // 3. → clock2 → 3s → text → click
      await Promise.all([hideText(), crossfade('clock2.png', g)]);  if (!ok()) return;
      await wait(3000);                                              if (!ok()) return;
      await showText("Click the clock.");                            if (!ok()) return;
      await waitForClick();                                          if (!ok()) return;

      // 4. → clock3 → 3s → text → click
      await Promise.all([hideText(), crossfade('clock3.png', g)]);  if (!ok()) return;
      await wait(3000);                                              if (!ok()) return;
      await showText("Knock on the door.");                          if (!ok()) return;
      await waitForClick();                                          if (!ok()) return;

      // 5. → dooropen → 3s → text → click
      await Promise.all([hideText(), crossfade('dooropen.png', g)]); if (!ok()) return;
      await wait(3000);                                              if (!ok()) return;
      await showText("Click the light.");                            if (!ok()) return;
      await waitForClick();                                          if (!ok()) return;

      // 6. → lighton (no text) → 2s → room
      await Promise.all([hideText(), crossfade('lighton.png', g)]);  if (!ok()) return;
      await wait(2000);                                              if (!ok()) return;
      await crossfade('room.png', g);                                if (!ok()) return;

      // 7. → 3s → final text
      await wait(3000);                                              if (!ok()) return;
      await showText("Thank you for helping me remember.");
    }

    // Restart button: stop the click from bubbling to the document handler,
    // then restart the sequence from the beginning.
    restartBtn.addEventListener('click', e => {
      e.stopPropagation();
      run();
    });

    run();
  </script>
</body>
</html>
