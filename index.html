<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Scene</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    background: #000;
    width: 100vw;
    height: 100vh;
    user-select: none;
  }

  /* ---- starfield ---- */
  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    opacity: 0.4;
    animation: twinkle 3s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0%   { opacity: 0.2; }
    100% { opacity: 0.9; }
  }

  /* ---- stage ---- */
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }

  /* ---- earth (rises from below) ---- */
  #earth {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 140vw;
    height: 80vh;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: transform 2s cubic-bezier(.25,.46,.45,.94),
                opacity 1.6s ease;
  }
  #earth svg {
    width: 100%;
    height: 100%;
  }
  #earth.visible {
    transform: translateX(-50%) translateY(0%);
    opacity: 1;
  }

  /* ---- ufo group (ufo + robot + helmet inside) ---- */
  #ufo-group {
    position: absolute;
    left: 50%;
    top: 28%;
    transform: translateX(-50%);
    z-index: 10;
    cursor: pointer;
    animation: float 3.5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { top: 28%; }
    50%      { top: 26%; }
  }
  #ufo-group.exit-up {
    animation: none;
    top: -300px;
    opacity: 0;
    transition: top 2.2s cubic-bezier(.55,.06,.68,.19),
                opacity 2s ease;
  }

  /* ufo saucer */
  #ufo-ship {
    width: 280px;
    display: block;
    margin: 0 auto;
  }

  /* robot sitting inside the dome */
  #robot-inside {
    position: absolute;
    width: 70px;
    left: 50%;
    transform: translateX(-50%);
    top: -12px;
    z-index: 11;
    pointer-events: none;
  }

  /* helmet on robot's head while inside UFO */
  #helmet-on {
    position: absolute;
    width: 42px;
    left: 50%;
    transform: translateX(-50%);
    top: -30px;
    z-index: 12;
    pointer-events: none;
  }

  /* ---- robot on earth (hidden initially) ---- */
  #robot-landed {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    z-index: 8;
    opacity: 0;
    pointer-events: none;
  }
  #robot-landed.show {
    opacity: 1;
    transition: opacity 0.6s ease 0.8s;
  }

  /* ---- helmet dropping beside robot ---- */
  #helmet-dropped {
    position: absolute;
    bottom: 20%;
    left: calc(50% + 70px);
    transform: translateX(-50%);
    width: 40px;
    z-index: 9;
    opacity: 0;
    pointer-events: none;
  }
  #helmet-dropped.lift {
    bottom: 30%;
    opacity: 1;
    transition: bottom 0.8s ease, opacity 0.4s ease;
  }
  #helmet-dropped.drop {
    bottom: 18%;
    opacity: 1;
    transition: bottom 0.6s cubic-bezier(.22,.61,.36,1) 0.05s,
                opacity 0.3s ease;
    transform: translateX(-50%) rotate(15deg);
  }

  /* ---- prompt ---- */
  #prompt {
    position: absolute;
    bottom: 5%;
    width: 100%;
    text-align: center;
    color: rgba(200,230,255,0.6);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #prompt.show { opacity: 1; }
</style>
</head>

<script>
(function () {
  /* ---- generate stars ---- */
  var starsEl = document.getElementById('stars');
  for (var i = 0; i < 100; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var size = Math.random() * 2 + 0.5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
    s.style.animationDuration = (Math.random() * 3 + 2).toFixed(2) + 's';
    starsEl.appendChild(s);
  }

  /* ---- refs ---- */
  var ufoGroup      = document.getElementById('ufo-group');
  var robotInside   = document.getElementById('robot-inside');
  var helmetOn      = document.getElementById('helmet-on');
  var earth         = document.getElementById('earth');
  var robotLanded   = document.getElementById('robot-landed');
  var helmetDropped = document.getElementById('helmet-dropped');
  var prompt        = document.getElementById('prompt');

  var scene = 1; // 1 = in space, 2 = on earth

  /* show prompt */
  setTimeout(function () { prompt.classList.add('show'); }, 500);

  /* ---- Click UFO ---- */
  ufoGroup.addEventListener('click', function () {

    /* ---- Scene 1 click: Earth rises ---- */
    if (scene === 1) {
      scene = 'transitioning';
      prompt.classList.remove('show');

      earth.classList.add('visible');

      /* after earth settles, update prompt */
      setTimeout(function () {
        scene = 2;
        prompt.textContent = 'Click the UFO again';
        prompt.classList.add('show');
      }, 2200);
      return;
    }

    /* ---- Scene 2 click: Robot lands, UFO exits ---- */
    if (scene === 2) {
      scene = 'done';
      prompt.classList.remove('show');

      /* hide robot + helmet inside UFO */
      robotInside.style.transition = 'opacity 0.4s ease';
      robotInside.style.opacity = '0';
      helmetOn.style.transition = 'opacity 0.4s ease';
      helmetOn.style.opacity = '0';

      /* show landed robot */
      robotLanded.classList.add('show');

      /* UFO exits upward */
      setTimeout(function () {
        ufoGroup.classList.add('exit-up');
      }, 600);

      /* helmet sequence: lift off head, then drop beside */
      setTimeout(function () {
        helmetDropped.classList.add('lift');
      }, 1400);

      setTimeout(function () {
        helmetDropped.classList.remove('lift');
        helmetDropped.classList.add('drop');
      }, 2400);
    }
  });
})();
</script>
